spring:
  application:
    name: strategy-engine

quantstream:
  topic:
    features: features
    signals: signals
  kafka:
    group-id: strategy-engine
  strategy:
    obi:
      enabled: true
      threshold: 0.5   # |OBI| >= 0.5 triggers a signal
    ou:                # Ornstein-Uhlenbeck mean reversion (stateful)
      enabled: true
      window: 600      # rolling microprice lookback (~10 min at 1 obs/sec) = warmup
      entry-z: 2.0     # |z| >= 2.0 opens a reversion position
      exit-z: 0.5      # |z| <= 0.5 closes (must be < entry-z for hysteresis)

server:
  port: 8084

logging:
  level:
    com.quantstream: INFO
