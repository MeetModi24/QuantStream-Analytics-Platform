# QuantStream token universe.
#
# SINGLE SOURCE OF TRUTH for which tokens the system runs and their microstructure
# parameters. Scaling is a change to THIS FILE ONLY; no service code changes.
#
# Per-token parameters:
#   symbol       : ticker, unique key
#   category     : tech | crypto | financials | energy | healthcare | consumer | industrial | utilities
#   initialPrice : seed price for the simulation (real ~late-2025 reference levels)
#   tickSize     : minimum price increment
#   spread       : typical bid-ask spread (price units)
#   baseVolume   : top-of-book volume scale (~ $1M notional / price)
#   volatility   : per-tick price volatility (fractional std of the GBM step)
#
# `enabled` toggles a token without deleting its definition. All 100 are enabled;
# flip any to false to run a smaller set for a scaling test.

